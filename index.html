<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR.js A-Frame Location-based</title>
    <!-- A-Frame library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js location based libraries -->
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <!--
      IMPORTANT:
      Replace the latitude and longitude values below with a location very close to your actual position – about 0.001 degrees offset for both.
      For example, if your position is near 37.7749, -122.4194 then you might use 37.7759 and -122.4184 to place the box a short distance away.
      Run this on an HTTPS server, open on your mobile device, and allow GPS permissions.
    -->
    <a-scene 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false" 
      renderer="antialias: true; alpha: true">
      
      <!-- The camera with GPS capability -->
      <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>
      
      <!-- A red box placed slightly offset from your location -->
      <a-entity 
        material="color: red" 
        geometry="primitive: box" 
        gps-new-entity-place="latitude: 37.7759; longitude: -122.4184" 
        scale="10 10 10">
      </a-entity>
    </a-scene>

</body>
</html>
